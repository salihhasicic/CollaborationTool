<!DOCTYPE html>
<html>
<head>
    <title>Task anlegen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Optional: Zusätzliche Styles für Task-Seite */
    </style>
</head>
<body>
    <nav>
        <a href="/">Start</a>
        <a href="/projects">Projekte</a>
        <a href="/users">Benutzer</a>
        <a href="/login">Login</a>
    </nav>
    <div class="container">
        <h2>Neuen Task anlegen</h2>
        <form method="post" style="max-width:420px;margin:2rem auto;display:flex;flex-direction:column;gap:16px;">
            <input type="text" name="title" placeholder="Titel" required>
            <input type="text" name="description" placeholder="Beschreibung">
            <button type="submit">Anlegen</button>
        </form>
        <a href="/project/{{ project_id }}"><button type="button" style="margin-top:18px;">Zurück zum Projekt</button></a>
    </div>
</body>
</html>
