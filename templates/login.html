<!DOCTYPE html>
<html lang="de">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f1f5f9;
            color: #1f2937;
        }

        .container {
            max-width: 420px;
            margin: 60px auto;
            padding: 24px;
        }

        .card {
            background: #f9fafb;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 16px;
            color: #111827;
            font-size: 1.5em;
            text-align: center;
        }

        form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            margin-top: 12px;
        }

        form input[type="text"],
        form input[type="password"] {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            box-sizing: border-box;
            margin-bottom: 4px;
        }

        form button[type="submit"] {
            width: 100%;
            margin-top: 16px;
            background: #3C6E71;
            color: white;
            border: none;
            padding: 10px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        form button[type="submit"] {
            width: 100%;
            margin-top: 16px;
            background: #3C6E71;
            color: white;
            border: none;
            padding: 10px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        form button[type="submit"]:hover {
            background: #2A4E50;
        }

        .login-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            font-size: 0.95em;
        }

        .register-btn {
            background: #3C6E71;
            color: white;
            border-radius: 7px;
            border: none;
            padding: 8px 16px;
            font-size: 0.95em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .register-btn:hover {
            background: #2A4E50;
        }

        #error {
            color: #e11d48;
            margin-top: 14px;
            text-align: center;
        }
    </style>
    <script src="/static/app.js"></script>
<link rel="stylesheet" href="/static/responsive.css">
</head>

<body>
    <nav class="sidebar">
        <a href="/login"><img src="{{ url_for('static', filename='icon-profile.svg') }}"><span>Login</span></a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Login</h2>
            <form id="loginForm">
                <label for="username">Benutzername</label>
                <input type="text" name="username" id="username" required autocomplete="username">

                <label for="password">Passwort</label>
                <input type="password" name="password" id="password" required autocomplete="current-password">

                <button type="submit">Einloggen</button>
            </form>

            <div class="login-actions">
                <span>Noch kein Account?</span>
                <a href="/register"><button class="register-btn" type="button">Registrieren</button></a>
            </div>

            <p id="error">{{ error|default('') }}</p>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            })
                .then(async res => {
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || "Login fehlgeschlagen.");
                    return data;
                })
                .then(data => {
                    if (data.access_token) {
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('user_id');
                        window.location.href = "/start";
                    } else {
                        throw new Error(data.message || "Login fehlgeschlagen.");
                    }
                })
                .catch((err) => {
                    document.getElementById("error").innerText = err.message || "Netzwerkfehler beim Login.";
                });
        });
    </script>
</body>

</html>
