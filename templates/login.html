<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
        }
        .register-btn {
            background: linear-gradient(90deg, var(--accent) 0%, var(--primary) 100%);
            color: #222;
            font-weight: 600;
            border-radius: 7px;
            border: none;
            padding: 10px 22px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            margin-left: 10px;
        }
        .register-btn:hover {
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
        }
    </style>
</head>
<body>

<nav>
    <a href="/">Start</a>
    <a href="/projects">Projekte</a>
    <a href="/login" class="active">Login</a>
    <a href="/users">Benutzer</a>
</nav>

<div class="container" style="max-width:400px;">
    <h2>Login</h2>
    <form id="loginForm">
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" required autocomplete="username">
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" required autocomplete="current-password">
        <button type="submit">Login</button>
    </form>
    <div class="login-actions">
        <span>Noch kein Account?</span>
        <a href="/register"><button class="register-btn" type="button">Registrieren</button></a>
    </div>
    <p id="error" style="color:#e11d48; margin-top:12px;"></p>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        fetch("http://127.0.0.1:5000/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            if (data.access_token) {
                // **Kleinste Änderung: hier den Token speichern**
                localStorage.setItem('access_token', data.access_token);

                // Zugriff auf Haupt-Server (localhost:3000)
                return fetch("/auth/proxy-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "same-origin", // Cookie setzen
                    body: JSON.stringify({
                        access_token: data.access_token,
                        user_id: data.user_id
                    })
                });
            } else {
                throw new Error(data.message || "Login fehlgeschlagen.");
            }
        })
        .then(res => {
            if (res.ok) {
                window.location.href = "/users";
            } else {
                return res.json().then(data => {
                    document.getElementById("error").innerText = data.message || "Fehler beim Speichern.";
                });
            }
        })
        .catch((err) => {
            document.getElementById("error").innerText = err.message || "Netzwerkfehler beim Login.";
        });
    });
</script>

</body>
</html>
