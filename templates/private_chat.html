<!DOCTYPE html>
<html>
<head>
    <title>Privater Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .chat-container {
            max-width: 620px;
            margin: 32px auto;
            background: #f9fafb;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            padding: 24px;
        }

        .chat-header {
            font-size: 1.3em;
            font-weight: 600;
            color: #2A4E50;
            margin-bottom: 18px;
            border-bottom: 2px solid #2A4E50;
            padding-bottom: 6px;
        }

        .chat-messages {
            min-height: 240px;
            max-height: 360px;
            overflow-y: auto;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-msg-row {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
        }

        .chat-msg-row.me {
            justify-content: flex-end;
        }

        .chat-msg-row.them {
            justify-content: flex-start;
        }

        .chat-msg-bubble {
            padding: 10px 16px;
            border-radius: 16px;
            max-width: 75%;
            font-size: 1.08em;
            word-break: break-word;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
        }

        .chat-msg-row.me .chat-msg-bubble {
            background: #A7CAB1;
            color: #1b1f1e;
            border: 1.5px solid #6b9d86;
        }

        .chat-msg-row.them .chat-msg-bubble {
            background: #3C6E71;
            color: #fff;
        }

        .chat-msg-meta {
            font-size: 0.92em;
            color: #888;
            margin: 4px 8px;
            min-width: 110px;
            text-align: right;
        }

        .chat-form-row {
            display: flex;
            gap: 8px;
            border-top: 1px solid #e5e7eb;
            padding-top: 12px;
        }

        .chat-form-row input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1.5px solid #d1d5db;
            font-size: 1em;
            background: #fff;
        }

        .chat-form-row button {
            background: #3C6E71;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }

        .chat-form-row button:hover {
            background: #2A4E50;
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <a href="/start"><img src="{{ url_for('static', filename='icon-dashboard.svg') }}"><span>Dashboard</span></a>
        <a href="/projects"><img src="{{ url_for('static', filename='icon-project.svg') }}"><span>Projekte</span></a>
        <a href="/users"><img src="{{ url_for('static', filename='icon-users.svg') }}"><span>Benutzer</span></a>
        <a href="/chats"><img src="{{ url_for('static', filename='icon-chat.svg') }}"><span>Chat</span></a>
        {% if team_id %}
        <a href="/team/{{ team_id }}"><img src="{{ url_for('static', filename='icon-team.svg') }}"><span>Team</span></a>
        <a href="/chat/{{ team_id }}"><img src="{{ url_for('static', filename='icon-team-chat.svg') }}"><span>Team-Chat</span></a>
        {% endif %}
        <a href="/team_manage"><img src="{{ url_for('static', filename='icon-team.svg') }}"><span>Team verwalten</span></a>
        {% if logged_in %}
        <a href="/profile/{{ user_id }}"><img src="{{ url_for('static', filename='icon-profile.svg') }}"><span>Mein Profil</span></a>
        <a href="/logout"><img src="{{ url_for('static', filename='icon-logout.svg') }}"><span>Logout</span></a>
        {% else %}
        <a href="/login"><img src="{{ url_for('static', filename='icon-profile.svg') }}"><span>Login</span></a>
        {% endif %}
    </nav>
    <div class="chat-container">
        <div class="chat-header">
            Privater Chat mit <span id="chat-partner"></span>
        </div>
        <div class="chat-messages" id="messages"></div>
        <form id="sendForm" autocomplete="off">
            <div class="chat-form-row">
                <input type="text" id="msgInput" required placeholder="Nachricht...">
                <button type="submit">Senden</button>
            </div>
        </form>
    </div>
    <script>
        const currentUserId = localStorage.getItem('user_id');
        const partnerId = window.location.pathname.split('/').pop();

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function loadMessages() {
            fetch(`/chat/private/${currentUserId}/${partnerId}`)
                .then(r => r.json())
                .then(msgs => {
                    let html = '';
                    let partnerName = '';
                    msgs.forEach(m => {
                        const isMe = String(m.sender_id) === String(currentUserId);
                        const rowClass = isMe ? 'me' : 'them';
                        if (!isMe) partnerName = m.sender_name;
                        html += `
                            <div class="chat-msg-row ${rowClass}">
                                ${!isMe ? `<div class="chat-msg-meta">${m.sender_name}<br>${new Date(m.timestamp).toLocaleString()}</div>` : ''}
                                <div class="chat-msg-bubble">${escapeHtml(m.content)}</div>
                                ${isMe ? `<div class="chat-msg-meta">Du<br>${new Date(m.timestamp).toLocaleString()}</div>` : ''}
                            </div>
                        `;
                    });
                    document.getElementById('messages').innerHTML = html || "<div style='color:#aaa;'>Noch keine Nachrichten</div>";
                    document.getElementById('chat-partner').innerText = partnerName || partnerId;
                    const msgDiv = document.getElementById('messages');
                    msgDiv.scrollTop = msgDiv.scrollHeight;
                });
        }
        loadMessages();
        window.onfocus = loadMessages;

        document.getElementById('sendForm').onsubmit = function(e) {
            e.preventDefault();
            const content = document.getElementById('msgInput').value;
            fetch('/chat/private/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sender_id: currentUserId,
                    receiver_id: partnerId,
                    content: content
                })
            }).then(() => {
                document.getElementById('msgInput').value = '';
                loadMessages();
            });
        };
    </script>
</body>
</html>
