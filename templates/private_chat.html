<!DOCTYPE html>
<html>
<head>
    <title>Privater Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .chat-container {
            max-width: 540px;
            margin: 32px auto;
            background: #f7fafc;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(37,99,235,0.08);
            padding: 24px 18px 18px 18px;
        }
        .chat-header {
            font-size: 1.3em;
            font-weight: 600;
            color: var(--primary-dark, #2563eb);
            margin-bottom: 18px;
        }
        .chat-messages {
            min-height: 220px;
            max-height: 340px;
            overflow-y: auto;
            margin-bottom: 18px;
            padding-right: 6px;
        }
        .chat-msg-row {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            margin-bottom: 12px;
        }
        .chat-msg-row.me {
            justify-content: flex-end;
        }
        .chat-msg-row.them {
            justify-content: flex-start;
        }
        .chat-msg-bubble {
            padding: 10px 16px;
            border-radius: 16px;
            max-width: 75%;
            font-size: 1.08em;
            word-break: break-word;
            box-shadow: 0 1px 4px rgba(37,99,235,0.05);
            margin-bottom: 2px;
        }
        .chat-msg-row.me .chat-msg-bubble {
            background: linear-gradient(90deg, #2563eb 0%, #fbbf24 100%);
            color: #fff;
        }
        .chat-msg-row.them .chat-msg-bubble {
            background: #fffbe6;
            color: #222;
            border: 1.5px solid #fbbf24;
        }
        .chat-msg-meta {
            font-size: 0.92em;
            color: #888;
            margin-top: 1px;
            margin-left: 8px;
            margin-right: 8px;
            min-width: 110px;
            text-align: right;
        }
        .chat-form-row {
            display: flex;
            gap: 8px;
        }
        .chat-form-row input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1.5px solid #d1d5db;
            font-size: 1em;
        }
        .chat-form-row button {
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }
        .chat-form-row button:hover {
            background: linear-gradient(90deg, var(--accent) 0%, var(--primary) 100%);
        }
    </style>
</head>
<body>
    <nav>
        <a href="/start">Dashboard</a>
        <a href="/projects">Projekte</a>
        <a href="/users">Benutzer</a>
        <a href="/chats">Chat</a>
        {% if logged_in %}
            <a href="/logout" style="margin-left:auto;">Logout</a>
        {% else %}
            <a href="/login" style="margin-left:auto;">Login</a>
        {% endif %}
    </nav>
    <div class="chat-container">
        <div class="chat-header">
            Privater Chat mit <span id="chat-partner"></span>
        </div>
        <div class="chat-messages" id="messages"></div>
        <form id="sendForm" autocomplete="off">
            <div class="chat-form-row">
                <input type="text" id="msgInput" required placeholder="Nachricht...">
                <button type="submit">Senden</button>
            </div>
        </form>
    </div>
    <script>
        // IDs aus URL oder Session holen
        const currentUserId = localStorage.getItem('user_id');
        const partnerId = window.location.pathname.split('/').pop();

        function escapeHtml(text) {
            var map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function loadMessages() {
            fetch(`/chat/private/${currentUserId}/${partnerId}`)
                .then(r => r.json())
                .then(msgs => {
                    let html = '';
                    let partnerName = '';
                    msgs.forEach(m => {
                        const isMe = String(m.sender_id) === String(currentUserId);
                        const rowClass = isMe ? 'me' : 'them';
                        if (!isMe) partnerName = m.sender_name;
                        html += `
                            <div class="chat-msg-row ${rowClass}">
                                ${!isMe ? `<div class="chat-msg-meta">${m.sender_name}<br>${new Date(m.timestamp).toLocaleString()}</div>` : ''}
                                <div class="chat-msg-bubble">${escapeHtml(m.content)}</div>
                                ${isMe ? `<div class="chat-msg-meta">Du<br>${new Date(m.timestamp).toLocaleString()}</div>` : ''}
                            </div>
                        `;
                    });
                    document.getElementById('messages').innerHTML = html || "<div style='color:#aaa;'>Noch keine Nachrichten</div>";
                    document.getElementById('chat-partner').innerText = partnerName || partnerId;
                    // Scroll nach unten
                    const msgDiv = document.getElementById('messages');
                    msgDiv.scrollTop = msgDiv.scrollHeight;
                });
        }
        loadMessages();

        // Nachrichten auch neu laden, wenn man auf den Chat-Link klickt (z.B. zurück zur Seite)
        window.onfocus = loadMessages;

        document.getElementById('sendForm').onsubmit = function(e) {
            e.preventDefault();
            const content = document.getElementById('msgInput').value;
            fetch('/chat/private/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    sender_id: currentUserId,
                    receiver_id: partnerId,
                    content: content
                })
            }).then(() => {
                document.getElementById('msgInput').value = '';
                loadMessages();
            });
        };
    </script>
</body>
</html>
