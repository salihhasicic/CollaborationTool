<!DOCTYPE html>
<html>
<head>
    <title>Projekt anlegen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Optional: Zusätzliche Styles für das Formular */
    </style>
</head>
<body>
    <nav>
        <a href="/">Start</a>
        <a href="/projects">Projekte</a>
        <a href="/users" class="active">Benutzer</a>
        <a href="/chats">Chat</a>
        {% if team_id %}
            <a href="/team/{{ team_id }}">Team</a>
            <a href="/chat/{{ team_id }}">Team-Chat</a>
        {% endif %}
        {% if logged_in %}
            <div style="margin-left:auto; display:flex; gap:1rem;">
            <a href="/profile/{{ user_id }}">Mein Profil</a>
            <a href="/logout">Logout</a>
        </div>
        {% else %}
            <a href="/login" style="margin-left:auto;">Login</a>
        {% endif %}
    </nav>
    <div class="container">
        <h2>Neues Projekt anlegen</h2>
        <form method="post" style="max-width:420px;margin:2rem auto;display:flex;flex-direction:column;gap:16px;">
            <input type="text" name="name" placeholder="Projektname" required>
            <button type="submit">Anlegen</button>
        </form>
        <a href="/projects"><button type="button" style="margin-top:18px;">Zurück zu den Projekten</button></a>
    </div>
</body>
</html>
