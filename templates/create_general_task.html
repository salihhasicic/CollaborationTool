<!DOCTYPE html>
<html>
<head>
    <title>Neuen Task erstellen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
         .form-card {
            background: #f9fafb;
            padding: 32px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-width: 480px;
            margin: 32px auto;
        }

        .form-card h2 {
            margin-top: 0;
            color: var(--primary-dark);
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        .form-group label {
            font-weight: 500;
            font-size: 0.95em;
            color: #374151;
        }

        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group select {
            padding: 12px;
            border: 1.5px solid var(--gray);
            border-radius: 8px;
            font-size: 1em;
            background: #f7fafc;
            transition: border 0.2s ease;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            background: #e0ecff;
            outline: none;
        }

        .form-group select {
            appearance: none;
            cursor: pointer;
        }

        .date-input::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
            cursor: pointer;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.05em;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
        }

        .back-btn {
            margin-top: 24px;
        }

        .back-btn button {
            background: #e5e7eb;
            color: #111;
        }

        .back-btn button:hover {
            background: #d1d5db;
        }
    </style>
</head>
<body>
<nav class="sidebar">
    <a href="/start"><img src="{{ url_for('static', filename='icon-dashboard.svg') }}"><span>Dashboard</span></a>
    <a href="/projects"><img src="{{ url_for('static', filename='icon-project.svg') }}"><span>Projekte</span></a>
    <a href="/users"><img src="{{ url_for('static', filename='icon-users.svg') }}"><span>Benutzer</span></a>
    <a href="/chats"><img src="{{ url_for('static', filename='icon-chat.svg') }}"><span>Chat</span></a>
    {% if team_id %}
        <a href="/team/{{ team_id }}"><img src="{{ url_for('static', filename='icon-team.svg') }}"><span>Team</span></a>
        <a href="/chat/{{ team_id }}"><img src="{{ url_for('static', filename='icon-team-chat.svg') }}"><span>Team-Chat</span></a>
    {% endif %}
    {% if logged_in %}
        <a href="/profile/{{ user_id }}"><img src="{{ url_for('static', filename='icon-profile.svg') }}"><span>Mein Profil</span></a>
        <a href="/logout"><img src="{{ url_for('static', filename='icon-logout.svg') }}"><span>Logout</span></a>
    {% else %}
        <a href="/login"><img src="{{ url_for('static', filename='icon-profile.svg') }}"><span>Login</span></a>
    {% endif %}
</nav>

<div class="container">
    <div class="form-card">
        <h2>Neuen Task erstellen</h2>
        <form method="post">
            <div class="form-group">
                <label for="project_id">Projekt auswählen</label>
                <select name="project_id" id="project_id" required>
                    {% for p in projects %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="title">Titel</label>
                <input type="text" name="title" id="title" placeholder="z. B. Testing vorbereiten" required>
            </div>

            <div class="form-group">
                <label for="description">Beschreibung</label>
                <input type="text" name="description" id="description" placeholder="Kurzbeschreibung">
            </div>

            <div class="form-group">
                <label for="deadline">Deadline (optional)</label>
                <input type="date" name="deadline" id="deadline">
            </div>

            <button type="submit" class="btn-submit">Task anlegen</button>
        </form>

        <div class="back-btn">
            <a href="/start">
                <button type="button" class="btn-submit" style="background:#e5e7eb; color:#111;">Zurück zum Dashboard</button>
            </a>
        </div>
    </div>
</div>
</body>
</html>
