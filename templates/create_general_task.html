<!DOCTYPE html>
<html>
<head>
    <title>Neuen Task erstellen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <a href="/start">Dashboard</a>
    <a href="/projects">Projekte</a>
    <a href="/users">Benutzer</a>
    <a href="/chats">Chat</a>
    {% if team_id %}
        <a href="/team/{{ team_id }}">Team</a>
        <a href="/chat/{{ team_id }}">Team-Chat</a>
    {% endif %}
    {% if logged_in %}
    <div style="margin-left:auto; display:flex; gap:1rem;">
        <a href="/profile/{{ user_id }}">Mein Profil</a>
        <a href="/logout">Logout</a>
    </div>
    {% endif %}
</nav>

<div class="container">
    <h2>Neuen Task erstellen</h2>
    <form method="post" style="max-width:460px;margin:2rem auto;display:flex;flex-direction:column;gap:16px;">
        <label for="project_id">Projekt auswählen:</label>
        <select name="project_id" required>
            {% for p in projects %}
                <option value="{{ p.id }}">{{ p.name }}</option>
            {% endfor %}
        </select>
        <input type="text" name="title" placeholder="Titel" required>
        <input type="text" name="description" placeholder="Beschreibung">
        <label for="deadline">Deadline (optional):</label>
        <input type="date" name="deadline" id="deadline">
        <button type="submit">Task anlegen</button>
    </form>
    <a href="/start"><button type="button">Zurück zum Dashboard</button></a>
</div>
</body>
</html>
