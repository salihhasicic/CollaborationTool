<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Team verwalten</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .section {
            margin-top: 32px;
        }

        .card {
            background: #f9fafb;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
        }

        h2 {
            color: #111827;
        }

        h3 {
            margin-bottom: 12px;
            border-bottom: 2px solid #2A4E50;
            padding-bottom: 4px;
        }

        .btn {
            background: #3C6E71;
            color: white;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.95em;
            cursor: pointer;
        }

        .btn:hover {
            background: #2A4E50;
        }

        .btn-delete {
            background: #ef4444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-delete:hover {
            background: #b91c1c;
        }

        .form-inline {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .form-inline input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            flex: 1;
            min-width: 200px;
        }

        .team-list {
            list-style: none;
            padding: 0;
            margin-top: 16px;
        }

        .team-list li {
            background: #f7fafc;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .create-status {
            color: #2563eb;
            margin-top: 8px;
        }
    </style>
    <script src="/static/app.js"></script>
<link rel="stylesheet" href="/static/responsive.css">
</head>
<body>

    <nav class="sidebar">
        <a href="/start"><img src="{{ url_for('static', filename='icon-dashboard.svg') }}"><span>Dashboard</span></a>
        <a href="/projects"><img src="{{ url_for('static', filename='icon-project.svg') }}"><span>Projekte</span></a>
        <a href="/users"><img src="{{ url_for('static', filename='icon-users.svg') }}"><span>Benutzer</span></a>
        <a href="/chats"><img src="{{ url_for('static', filename='icon-chat.svg') }}"><span>Chat</span></a>
        {% if team_id %}
        <a href="/team/{{ team_id }}"><img src="{{ url_for('static', filename='icon-team.svg') }}"><span>Team</span></a>
        <a href="/chat/{{ team_id }}"><img src="{{ url_for('static', filename='icon-team-chat.svg') }}"><span>Team-Chat</span></a>
        {% endif %}
        <a href="/team_manage"><img src="{{ url_for('static', filename='icon-team.svg') }}"><span>Team verwalten</span></a>
        {% if logged_in %}
        <a href="/profile/{{ user_id }}"><img src="{{ url_for('static', filename='icon-profile.svg') }}"><span>Mein Profil</span></a>
        <a href="/logout"><img src="{{ url_for('static', filename='icon-logout.svg') }}"><span>Logout</span></a>
        {% else %}
        <a href="/login"><img src="{{ url_for('static', filename='icon-profile.svg') }}"><span>Login</span></a>
        {% endif %}
    </nav>

    <div class="container">
        <h2>👥 Team verwalten</h2>

        <!-- Neues Team erstellen -->
        <div class="card">
            <h3>➕ Neues Team erstellen</h3>
            <form id="createTeamForm" class="form-inline">
                <input type="text" id="teamName" name="teamName" required placeholder="Teamname">
                <button type="submit" class="btn">Erstellen</button>
            </form>
            <div id="team-create-status" class="create-status"></div>
        </div>

        <!-- Teamliste -->
        <div class="card">
            <h3>📋 Alle Teams</h3>
            <ul class="team-list" id="team-list">
                <!-- Teams werden per JS geladen -->
            </ul>
        </div>
    </div>

    <script>

const status = document.getElementById('team-create-status');
document.getElementById('createTeamForm').addEventListener('submit', async e => {
    e.preventDefault();
    try {
        const data = await requestJSON('/api/team/create', jsonOptions({name: document.getElementById('teamName').value}));
        status.textContent = `Team erfolgreich erstellt: ${data.name}`;
        document.getElementById('teamName').value = ''; await loadTeams();
    } catch(e) {status.textContent = e.message;}
});
async function loadTeams() {
    try {
        const teams = await requestJSON('/api/team/all');
        document.getElementById('team-list').replaceChildren(...teams.map(team => {
            const li = textElement('li', '', 'team-card-clickable');
            const link = textElement('a', team.name); link.href = `/team/${team.id}`;
            const form = document.createElement('form'); form.action = '/team/delete'; form.method = 'post';
            const input = document.createElement('input'); input.type = 'hidden'; input.name = 'team_id'; input.value = team.id;
            const button = textElement('button', 'Löschen', 'btn-delete'); button.type = 'submit';
            form.append(input, button);
            form.addEventListener('submit', async e => {
                e.preventDefault(); button.disabled = true;
                try {await requestJSON(`/api/team/${team.id}`, {method:'DELETE'}); status.textContent = 'Team gelöscht.'; await loadTeams();}
                catch(e) {status.textContent = e.message; button.disabled = false;}
            });
            li.append(link, form); return li;
        }));
    } catch(e) {status.textContent = e.message;}
}
loadTeams();

    </script>
</body>
</html>
