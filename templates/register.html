<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Registrieren</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #f1f5f9;
            color: #1f2937;
        }

        .container {
            max-width: 430px;
            margin: 60px auto;
            padding: 24px;
        }

        .card {
            background: #f9fafb;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 16px;
            color: #111827;
            font-size: 1.5em;
            text-align: center;
        }

        form label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            margin-top: 12px;
        }

        form input[type="text"],
        form input[type="password"],
        form input[type="file"],
        form select {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            box-sizing: border-box;
            background: #fff;
            margin-bottom: 8px;
        }

        form select {
            background: #f7fafc;
        }

        form select:focus,
        form input:focus {
            border: 1.5px solid #3C6E71;
            outline: none;
        }

        button[type="submit"] {
            width: 100%;
            background: #3C6E71;
            color: #fff;
            font-weight: 600;
            border: none;
            padding: 12px;
            font-size: 1.05em;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 14px;
            transition: background 0.2s;
            box-sizing: border-box;
        }

        button[type="submit"]:hover {
            background: #2A4E50;
        }

        .register-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            font-size: 0.95em;
        }

        .login-btn {
            background: #3C6E71;
            color: white;
            font-weight: 500;
            border-radius: 8px;
            border: none;
            padding: 8px 16px;
            font-size: 0.95em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #2A4E50;
        }

        .geo-status {
            color: #2563eb;
            font-size: 0.95em;
            margin-bottom: 10px;
        }

        .message {
            margin-top: 12px;
            text-align: center;
        }

        .message.error {
            color: #e11d48;
        }

        .message.success {
            color: green;
        }
    </style>
    <script src="/static/app.js"></script>
<link rel="stylesheet" href="/static/responsive.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Registrieren</h2>
            <form method="POST" action="/register" enctype="multipart/form-data" id="registerForm">
                <label for="photo">Profilbild:</label>
                <input type="file" name="photo" id="photo" accept="image/*">

                <label for="username">Benutzername:</label>
                <input type="text" name="username" id="username" required autocomplete="username">

                <label for="password">Passwort:</label>
                <input type="password" name="password" id="password" required autocomplete="new-password">

                <label for="team_id">Team:</label>
                <select name="team_id" id="team_id" required>
                    <option value="">Bitte wählen...</option>
                    {% for t in teams %}
                        <option value="{{ t.id }}">{{ t.name }}</option>
                    {% endfor %}
                </select>

                <label for="skills">Skills (Kommagetrennt):</label>
                <input type="text" name="skills" id="skills" placeholder="z.B. Python, Flask, SQL">

                <label for="location">Standort:</label>
                <input type="text" name="location" id="location" placeholder="z.B. Zürich" required>

                <input type="hidden" name="latitude" id="latitude">
                <input type="hidden" name="longitude" id="longitude">

                <div class="geo-status" id="geo-status"></div>

                <button type="submit">Registrieren</button>
            </form>

            <div class="register-actions">
                <span>Schon einen Account?</span>
                <a href="/login"><button class="login-btn" type="button">Login</button></a>
            </div>

            {% if error %}
            <p class="message error">{{ error }}</p>
            {% endif %}
            {% if success %}
            <p class="message success">{{ success }}</p>
            {% endif %}
        </div>
    </div>

    <script>
        // Geo-Location automatisch setzen
        window.onload = function () {
            var geoStatus = document.getElementById('geo-status');
            if (navigator.geolocation) {
                geoStatus.innerText = "Hole Standort...";
                navigator.geolocation.getCurrentPosition(function (pos) {
                    document.getElementById('latitude').value = pos.coords.latitude;
                    document.getElementById('longitude').value = pos.coords.longitude;
                    geoStatus.innerText = "Standort automatisch gesetzt.";
                }, function () {
                    geoStatus.innerText = "Standort konnte nicht automatisch ermittelt werden.";
                });
            } else {
                geoStatus.innerText = "Geolocation wird nicht unterstützt.";
            }
        }
    </script>
</body>
</html>
