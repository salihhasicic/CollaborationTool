<!DOCTYPE html>
<html>
<head>
    <title>Neues Team erstellen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="sidebar">
        <!-- ...existing sidebar code (wie in anderen Seiten, inkl. Team verwalten Link)... -->
        <a href="/start"><img src="{{ url_for('static', filename='icon-dashboard.svg') }}"><span>Dashboard</span></a>
        <a href="/projects"><img src="{{ url_for('static', filename='icon-project.svg') }}"><span>Projekte</span></a>
        <a href="/users"><img src="{{ url_for('static', filename='icon-users.svg') }}"><span>Benutzer</span></a>
        <a href="/chats"><img src="{{ url_for('static', filename='icon-chat.svg') }}"><span>Chat</span></a>
        {% if team_id %}
            <a href="/team/{{ team_id }}"><img src="{{ url_for('static', filename='icon-team.svg') }}"><span>Team</span></a>
            <a href="/chat/{{ team_id }}"><img src="{{ url_for('static', filename='icon-team-chat.svg') }}"><span>Team-Chat</span></a>
        {% endif %}
        <a href="/team_manage"><img src="{{ url_for('static', filename='icon-team.svg') }}"><span>Team verwalten</span></a>
        {% if logged_in %}
            <a href="/profile/{{ user_id }}"><img src="{{ url_for('static', filename='icon-profile.svg') }}"><span>Mein Profil</span></a>
            <a href="/logout"><img src="{{ url_for('static', filename='icon-logout.svg') }}"><span>Logout</span></a>
        {% else %}
            <a href="/login"><img src="{{ url_for('static', filename='icon-profile.svg') }}"><span>Login</span></a>
        {% endif %}
    </nav>
    <div class="container" style="max-width:400px;">
        <h2>Neues Team erstellen</h2>
        <form id="createTeamForm">
            <label for="teamName">Teamname:</label>
            <input type="text" id="teamName" name="teamName" required>
            <button type="submit">Team erstellen</button>
        </form>
        <div id="team-create-status" style="margin-top:12px;"></div>
    </div>
    <script>
        document.getElementById("createTeamForm").onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById("teamName").value;
            const token = localStorage.getItem('access_token');
            fetch("http://127.0.0.1:5000/team", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({ name })
            })
            .then(res => res.json().then(data => ({status: res.status, data})))
            .then(({status, data}) => {
                if (status === 201) {
                    document.getElementById("team-create-status").innerHTML = "Team erfolgreich erstellt: <b>" + data.name + "</b>";
                } else {
                    document.getElementById("team-create-status").innerText = data.error || "Fehler beim Erstellen.";
                }
            })
            .catch(() => {
                document.getElementById("team-create-status").innerText = "Netzwerkfehler.";
            });
        }
    </script>
</body>
</html>
