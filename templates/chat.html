<!DOCTYPE html>
<html>
<head>
    <title>Team Chat {{ team_id }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .chat-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-form textarea {
            resize: vertical;
        }
        .ai-chat-section {
            background: #f7fafc;
            border: 1.5px solid #fbbf24;
            border-radius: 10px;
            padding: 18px 22px 12px 22px;
            margin-bottom: 28px;
            box-shadow: 0 1px 8px rgba(251,191,36,0.08);
        }
        .ai-chat-label {
            font-weight: bold;
            color: #b68900;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        .ai-chat-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }
        .ai-chat-row input {
            flex: 1;
            padding: 10px;
            border-radius: 7px;
            border: 1.5px solid #e5e7eb;
            font-size: 1em;
        }
        .ai-chat-row button {
            background: #fbbf24;
            color: #222;
            font-weight: 600;
            border: none;
            border-radius: 7px;
            padding: 10px 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .ai-chat-row button:hover {
            background: #ffe066;
        }
        .ai-chat-answer {
            margin-top: 8px;
            background: #fffbe6;
            border-left: 4px solid #fbbf24;
            padding: 10px 16px;
            border-radius: 7px;
            color: #222;
            font-style: italic;
            min-height: 24px;
        }
        .ai-suggestion {
            background: #f7fafc;
            border-left: 4px solid #fbbf24;
            padding: 10px 16px;
            margin-bottom: 10px;
            border-radius: 7px;
            color: #222;
            font-style: italic;
            display: none;
        }
        .ai-suggestion.visible {
            display: block;
        }
        .ai-suggestion-action {
            margin-left: 12px;
            color: #2563eb;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.98em;
        }
        .ai-suggestion-action:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Start</a>
        <a href="/projects">Projekte</a>
        <a href="/users">Benutzer</a>
        <a href="/team/{{ team_id }}">Team</a>
        <a href="/chat/{{ team_id }}" class="active">Team-Chat</a>
    </nav>
    <div class="container">
        <!-- KI-Chat Sektion -->
        <div class="ai-chat-section">
            <div class="ai-chat-label">Chatte mit der KI</div>
            <div class="ai-chat-row">
                <input type="text" id="ai-input" placeholder="Frage an die KI..." onkeydown="if(event.key==='Enter'){event.preventDefault();askAI();}">
                <button type="button" onclick="askAI()">Senden</button>
            </div>
            <div id="ai-answer" class="ai-chat-answer"></div>
        </div>
        <!-- Team Chat -->
        <h2>Chat – Team {{ team_id }}</h2>
        <div class="chat-box" id="chat-box">
            {% for msg in messages %}
            <div class="chat-message">
                <span class="chat-sender">{{ msg.sender_id }}</span>:
                {{ msg.message or msg.content }}
                <span class="chat-timestamp">({{ msg.timestamp }})</span>
            </div>
            {% endfor %}
        </div>
        <button class="ai-btn" type="button" onclick="suggestAIReply()">AI-Antwort vorschlagen</button>
        <div id="ai-suggestion" class="ai-suggestion"></div>
        <form method="post" action="/chat/{{ team_id }}" class="chat-form" id="chat-form">
            <input type="hidden" name="sender_id" value="1">
            <textarea name="message" id="message" rows="3" required placeholder="Nachricht eingeben..."></textarea>
            <button type="submit">Senden</button>
        </form>
        <br>
        <a href="/team/{{ team_id }}"><button type="button">Zurück zum Team</button></a>
    </div>
    <script>
        // Nutze die vom Backend übergebene Variable
        const BACKEND_URL = "{{ backend_url }}";

        window.onload = function() {
            var chatBox = document.getElementById('chat-box');
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        function suggestAIReply() {
            var chatBox = document.getElementById('chat-box');
            var messages = chatBox.getElementsByClassName('chat-message');
            if (messages.length === 0) return;
            var lastMsg = messages[messages.length-1].innerText;
            var msgText = lastMsg.replace(/^[^:]+:\s*/, '').replace(/\([^)]+\)$/, '').trim();
            var aiDiv = document.getElementById('ai-suggestion');
            aiDiv.classList.remove('visible');
            aiDiv.innerHTML = "AI denkt ...";
            aiDiv.classList.add('visible');
            fetch(`${BACKEND_URL}/chat/suggest`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msgText})
            })
            .then(r => r.json())
            .then(data => {
                if (data.suggested_reply) {
                    aiDiv.innerHTML = 
                        `<span>${data.suggested_reply}</span>
                        <span class="ai-suggestion-action" onclick="useAISuggestion()">Übernehmen</span>`;
                    aiDiv.classList.add('visible');
                    window._aiSuggestion = data.suggested_reply;
                } else {
                    aiDiv.innerHTML = "AI konnte keine Antwort generieren.";
                }
            });
        }
        function useAISuggestion() {
            if (window._aiSuggestion) {
                document.getElementById('message').value = window._aiSuggestion;
                document.getElementById('ai-suggestion').classList.remove('visible');
            }
        }
        function askAI() {
            var input = document.getElementById('ai-input');
            var answerDiv = document.getElementById('ai-answer');
            var question = input.value.trim();
            if (!question) return;
            answerDiv.innerHTML = "KI denkt ...";
            fetch(`${BACKEND_URL}/chat/suggest`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: question})
            })
            .then(r => r.json())
            .then(data => {
                if (data.suggested_reply) {
                    answerDiv.innerHTML = data.suggested_reply;
                } else if (data.error) {
                    answerDiv.innerHTML = "Fehler: " + data.error;
                } else {
                    answerDiv.innerHTML = "KI konnte keine Antwort generieren.";
                }
            })
            .catch(() => {
                answerDiv.innerHTML = "Fehler bei der Kommunikation mit der KI.";
            });
        }
    </script>
</body>
</html>
